name: Dev Pipeline

on:
  push:
    branches:
      - dev

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show files
      run: |
        ls -la

    - name: Install dependencies
      run: |
        cd server
        npm install

    - name: Test
      run: |
        echo "Testing completed"